name: Generate Pac-Man contribution graph

on:
  schedule:
    # roda automaticamente todo dia à meia-noite UTC
    - cron: '0 0 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # 'pacman' é o jogo que come as contribuições
          games: 'pacman'

      # Esse passo é o que faltava: publica o SVG gerado na branch "output"
      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
